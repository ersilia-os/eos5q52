Title: Antimicrobial activity prediction against Streptococcus pneumoniae from public ChEMBL data
Description: Scores compounds for activity against Streptococcus pneumoniae, a leading cause of pneumonia and meningitis where penicillin and macrolide resistance have both spread. Eight independent classifiers were fitted to distinct ChEMBL bioactivity pools and their outputs merged into a quality-weighted consensus. Public screening against this organism is thinner than for the ESKAPE pathogens, so several sub-models rest on modest compound numbers and the consensus is weighted accordingly.
